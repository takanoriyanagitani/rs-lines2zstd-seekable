[package]
name = "rs-lines2zstd-seekable"
version = "0.1.0"
edition = "2024"

exclude = [
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "lines2zeek"

[dependencies.zrip]
version = "0.8.17"
default-features = false
features = [
  "frame",
  "ldm",
  "simd",
  "std",
]
